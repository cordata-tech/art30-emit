name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor the published code needs. The two above it are what
        # catches a deprecation while it is still a warning rather than a release
        # later, when it is somebody's failed upgrade.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      # The README's first example is the one a reader will try, so it runs here
      # and its output is asserted rather than described.
      - name: The documented first run produces the facet
        run: |
          ART30_EMIT_FILE=events.jsonl \
            art30-emit --job demo/hello --purpose demonstration --legal-basis consent \
            --writes demo/out --tag demo/out:data_category=contact \
            -- echo hello
          python - <<'PY'
          import json, pathlib
          events = [json.loads(line) for line in pathlib.Path("events.jsonl").read_text().splitlines()]
          assert [e["eventType"] for e in events] == ["START", "COMPLETE"], events
          facet = events[0]["job"]["facets"]["processing"]
          assert facet["purpose"] == "demonstration", facet
          assert facet["legal_basis"] == "consent", facet
          tags = events[0]["outputs"][0]["facets"]["tags"]["tags"]
          assert tags[0]["key"] == "data_category", tags
          print("the documented run emits what the README says it does")
          PY

      # The worked example's transcript is the evidence for the claim on the
      # front page: events from this package become a record that stands on
      # emitted evidence. Qedro comes from PyPI rather than a checkout, so a
      # release of it that changed the output fails here rather than in a reader's
      # terminal.
      - name: The worked example still produces the captured transcript
        if: matrix.python-version == '3.12'
        run: |
          pip install qedro
          python tools/capture_example.py --check
